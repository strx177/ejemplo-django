{% extends "catalogo/base.html" %}
{% block content %}
<h1>Eliminar Categoria</h1>
<p>¿Estás seguro de que deseas eliminar la categoria <strong>{{ obj.nombre }}</strong>?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Si, eliminar</button>
    <a href="{% url 'lista_categorias' %} " class="btn btn-secondary">Cancelar</a>
</form>
{% endblock  %}
