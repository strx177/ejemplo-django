{% extends "catalogo/base.html" %}
{% block content %}
<h1>Eliminar Autor</h1>
<p>¿Estás seguro de que deseas eliminar al autor <strong>{{ obj.nombre }} {{ obj.apellido }}</strong>?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Si, eliminar</button>
    <a href="{% url 'lista_autores' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
